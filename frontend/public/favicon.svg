<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2d78"/>
      <stop offset="0.5" stop-color="#bf00ff"/>
      <stop offset="1" stop-color="#00f5ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" fill="#0d0d0d"/>

  <!-- Angular chat bubble -->
  <path
    d="M8 17 L17 8 H56 V39 L48 47 H29 L18 57 V47 H8 Z"
    fill="#16081a"
    stroke="url(#neon)"
    stroke-width="5"
    stroke-linejoin="miter"
    filter="url(#glow)"
  />

  <!-- >_ terminal prompt -->
  <g filter="url(#glow)">
    <polyline
      points="19,20 28,27.5 19,35"
      fill="none"
      stroke="#00f5ff"
      stroke-width="5"
      stroke-linecap="square"
      stroke-linejoin="miter"
    />
    <rect x="31" y="31" width="14" height="5" fill="#ff2d78"/>
  </g>
</svg>
