# Builds the ConnectHub Android app.
#  - Push a tag like v1.0.0  -> signed release APK published to GitHub Releases
#    (the website's download button always points at the latest release)
#  - Push to main (frontend changes) -> test build, downloadable from the run's artifacts
name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "frontend/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci

      # Firebase config for push notifications (optional — app builds without it)
      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "VITE_FCM_ENABLED=true" >> "$GITHUB_ENV"
            echo "Push notifications: enabled"
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not set — building without push notifications"
          fi

      - name: Build web app and sync into Android project
        run: npm run build:native

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Release builds need the ANDROID_KEYSTORE_* secrets"
            exit 1
          else
            echo "::warning::No signing key — making a debug build"
          fi

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.0.${{ github.run_number }}-dev" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          # versionCode must go up with every build, or Android won't install the update
          ARGS="-PversionCode=${{ github.run_number }} -PversionName=$VERSION_NAME --no-daemon"
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew assembleRelease $ARGS
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/ConnectHub.apk"
          else
            ./gradlew assembleDebug $ARGS
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/ConnectHub.apk"
          fi
          ls -la "$GITHUB_WORKSPACE/ConnectHub.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ConnectHub-${{ env.VERSION_NAME }}
          path: ConnectHub.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ConnectHub.apk
          name: ConnectHub ${{ github.ref_name }}
          generate_release_notes: true
